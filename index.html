<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple, modern, and colorful Counter Application built with vanilla HTML, CSS, and JavaScript.">
  <title>Modern Counter App</title>
  <!-- Google Fonts for modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Decorative background shapes for visual flair -->
  <div class="bg-blur bg-blur-1" aria-hidden="true"></div>
  <div class="bg-blur bg-blur-2" aria-hidden="true"></div>

  <main class="container">
    <div class="counter-card">
      <header class="card-header">
        <span class="badge">Simple &amp; Clean</span>
        <h1 class="card-title">Counter Application</h1>
      </header>

      <!-- Counter Display Area -->
      <section class="display-section" aria-label="Counter display">
        <span class="counter-label" id="counterLabel">Current Count</span>
        <div id="counterValue" class="counter-value" aria-live="polite" aria-atomic="true">0</div>
        <div id="counterBadge" class="status-indicator">Zero</div>
      </section>

      <!-- Action Buttons -->
      <div class="button-group" role="group" aria-label="Counter controls">
        <!-- Decrease Button -->
        <button id="decreaseBtn" class="btn btn-decrease" type="button" aria-label="Decrease counter">
          <span class="btn-icon" aria-hidden="true">&minus;</span>
          <span class="btn-text">Decrease</span>
        </button>

        <!-- Reset Button -->
        <button id="resetBtn" class="btn btn-reset" type="button" aria-label="Reset counter to zero">
          <span class="btn-icon" aria-hidden="true">&#x21bb;</span>
          <span class="btn-text">Reset</span>
        </button>

        <!-- Increase Button -->
        <button id="increaseBtn" class="btn btn-increase" type="button" aria-label="Increase counter">
          <span class="btn-icon" aria-hidden="true">&#43;</span>
          <span class="btn-text">Increase</span>
        </button>
      </div>

      <!-- Helpful keyboard shortcuts footer -->
      <footer class="card-footer">
        <p class="shortcuts-hint">
          <span>Keyboard shortcuts:</span> 
          <kbd>+</kbd> or <kbd>&uarr;</kbd> Increase &bull; 
          <kbd>&minus;</kbd> or <kbd>&darr;</kbd> Decrease &bull; 
          <kbd>R</kbd> Reset
        </p>
      </footer>
    </div>
  </main>

  <!-- JavaScript logic -->
  <script src="script.js"></script>
</body>
</html>
